    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Light Theme Variables */
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --primary-dark: #6B2E0E;
            --secondary: #DAA520;
            --secondary-light: #F0C45A;
            --accent: #2E8B57;
            --bg-primary: #ffffff;
            --bg-secondary: #F8F5F0;
            --bg-tertiary: #f0e9e0;
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-muted: #777777;
            --border-color: #e0d5c8;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --transition: all 0.3s ease;
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --primary: #B87333;
            --primary-light: #CD7F4B;
            --primary-dark: #9E5E2A;
            --secondary: #FFD966;
            --accent: #3CB371;
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #333333;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #b0b0b0;
            --border-color: #404040;
            --card-bg: #2d2d2d;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.4);
            --overlay-bg: rgba(0, 0, 0, 0.9);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* Gallery Section Styles */
        .gallery-section {
            padding: 100px 0;
            background-color: var(--bg-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Section Header */
        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .section-header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--secondary);
        }

        .section-header p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 20px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background-color: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 3px solid var(--bg-primary);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background-color: var(--primary-dark);
        }

        .theme-toggle i {
            font-size: 1.8rem;
        }

        /* Category Filter */
        .gallery-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 28px;
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
        }

        .gallery-item-image {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        .gallery-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover .gallery-item-image img {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
            opacity: 0;
            transition: var(--transition);
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h3 {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 8px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .gallery-overlay p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-bottom: 15px;
            transform: translateY(20px);
            transition: transform 0.3s ease 0.05s;
        }

        .gallery-overlay .view-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            display: inline-block;
            width: fit-content;
            font-size: 0.9rem;
            font-weight: 500;
            transform: translateY(20px);
            transition: transform 0.3s ease 0.1s, background-color 0.3s ease;
        }

        .gallery-overlay .view-btn:hover {
            background-color: var(--secondary);
        }

        .gallery-item:hover .gallery-overlay h3,
        .gallery-item:hover .gallery-overlay p,
        .gallery-item:hover .gallery-overlay .view-btn {
            transform: translateY(0);
        }

        .gallery-category-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 2;
            opacity: 0.9;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            margin: auto;
            background-color: var(--bg-primary);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-hover);
            animation: zoomIn 0.3s ease;
        }

        .lightbox-content img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-info {
            padding: 20px;
            background-color: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }

        .lightbox-info h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .lightbox-info p {
            color: var(--text-secondary);
            margin-bottom: 0;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }

        .lightbox-close:hover {
            background-color: var(--secondary);
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }

        .lightbox-nav button {
            background-color: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .lightbox-nav button:hover {
            background-color: var(--secondary);
            transform: scale(1.1);
        }

        /* Statistics Section */
        .gallery-stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 60px;
            padding: 40px;
            background-color: var(--bg-secondary);
            border-radius: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            .gallery-section {
                padding: 60px 0;
            }
            
            .section-header h1 {
                font-size: 2.3rem;
            }
            
            .section-header p {
                font-size: 1rem;
            }
            
            .gallery-filters {
                gap: 10px;
            }
            
            .filter-btn {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
            
            .gallery-stats {
                gap: 30px;
                padding: 30px 20px;
            }
            
            .stat-number {
                font-size: 2rem;
            }
            
            .lightbox-nav button {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .gallery-filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-btn {
                text-align: center;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>

                description: "Sharing the Gospel in rural communities",
                category: "outreach",
                image: "https://images.unsplash.com/photo-1537047902294-62a40c20a6ae?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80",
                date: "2023-05-20"
            }
        ];

        // DOM Elements
        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDescription = document.getElementById('lightboxDescription');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalPhotosSpan = document.getElementById('totalPhotos');
        const eventsCountSpan = document.getElementById('eventsCount');

        let currentFilter = 'all';
        let currentLightboxIndex = 0;
        let filteredItems = [];

        // Render Gallery
        function renderGallery() {
            let filteredData = galleryData;
            
            if (currentFilter !== 'all') {
                filteredData = galleryData.filter(item => item.category === currentFilter);
            }
            
            filteredItems = filteredData;
            
            // Update statistics
            totalPhotosSpan.textContent = filteredData.length;
            const eventsCount = filteredData.filter(item => item.category === 'events').length;
            eventsCountSpan.textContent = eventsCount;
            
            // Generate HTML
            galleryGrid.innerHTML = filteredData.map((item, index) => `
                <div class="gallery-item" data-id="${item.id}" data-index="${index}" style="animation-delay: ${index * 0.05}s">
                    <div class="gallery-item-image">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="gallery-category-badge">
                            ${getCategoryName(item.category)}
                        </div>
                    </div>
                    <div class="gallery-overlay">
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <span class="view-btn">View Photo <i class="fas fa-arrow-right"></i></span>
                    </div>
                </div>
            `).join('');
            
            // Add click event listeners to gallery items
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const index = parseInt(item.dataset.index);
                    openLightbox(index);
                });
            });
        }
        
        function getCategoryName(category) {
            const categories = {
                worship: 'Worship',
                events: 'Events',
                outreach: 'Outreach',
                youth: 'Youth',
                building: 'Building'
            };
            return categories[category] || category;
        }
        
        // Open Lightbox
        function openLightbox(index) {
            currentLightboxIndex = index;
            const item = filteredItems[index];
            lightboxImage.src = item.image;
            lightboxTitle.textContent = item.title;
            lightboxDescription.textContent = `${item.description} • ${formatDate(item.date)}`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        // Close Lightbox
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // Navigate Lightbox
        function nextImage() {
            currentLightboxIndex = (currentLightboxIndex + 1) % filteredItems.length;
            openLightbox(currentLightboxIndex);
        }
        
        function prevImage() {
            currentLightboxIndex = (currentLightboxIndex - 1 + filteredItems.length) % filteredItems.length;
            openLightbox(currentLightboxIndex);
        }
        
        // Format Date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        
        // Filter Function
        function setFilter(filter) {
            currentFilter = filter;
            renderGallery();
            
            // Update active button state
            filterBtns.forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // Event Listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setFilter(btn.dataset.filter);
            });
        });
        
        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);
        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'ArrowRight') {
                nextImage();
            } else if (e.key === 'ArrowLeft') {
                prevImage();
            } else if (e.key === 'Escape') {
                closeLightbox();
            }
        });
        
        // Theme Toggle Functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        
        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                themeIcon.className = 'fas fa-sun';
                themeToggle.style.backgroundColor = '#FFD966';
            } else {
                themeIcon.className = 'fas fa-moon';
                themeToggle.style.backgroundColor = '#8B4513';
            }
        }
        
        updateThemeIcon(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
        
        // Initialize Gallery
        renderGallery();
        
        // Add smooth scroll animation
        window.addEventListener('load', () => {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach((item, index) => {
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            });
        });
        
        // Lazy loading images
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src || img.src;
                    observer.unobserve(img);
                }
            });
        });
        
        document.querySelectorAll('.gallery-item-image img').forEach(img => {
            imageObserver.observe(img);
        });
    </script>
</body>
</html>
